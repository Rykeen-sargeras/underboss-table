<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Connect Underboss</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#39161a,#0a0a0b 58%);color:#f3ead9;font:16px Arial,sans-serif}.box{width:min(90vw,520px);background:#151518;border:1px solid #494246;padding:38px;box-shadow:0 25px 80px #000}.mark{color:#d4a64a;font-size:42px}h1{margin:10px 0;font-size:34px;text-transform:uppercase}p{color:#aaa49b;line-height:1.6}label{display:block;margin-top:24px;color:#d4a64a;font-size:13px;font-weight:bold}input{display:block;width:100%;margin:8px 0 14px;background:#0d0d0f;color:white;border:1px solid #4a4547;padding:14px;font-size:16px}button{width:100%;border:0;padding:14px;background:#d4a64a;color:#15130e;font-weight:bold;cursor:pointer}.error{color:#e4797f;font-size:13px}
</style></head><body><form class="box" id="setup"><div class="mark">♛</div><h1>Connect to the family</h1><p>Paste the public Railway address for your Underboss server. You only need to do this once.</p><label for="url">RAILWAY SERVER ADDRESS</label><input id="url" type="url" required placeholder="https://your-game.up.railway.app"><div class="error" id="error"></div><button>Connect</button></form><script>
const params=new URLSearchParams(location.search);document.getElementById('error').textContent=params.get('error')||'';document.getElementById('setup').addEventListener('submit',e=>{e.preventDefault();location.href='underboss-config://save?url='+encodeURIComponent(document.getElementById('url').value)});
</script></body></html>
